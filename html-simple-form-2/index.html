<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Form thông tin cá nhân</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
            }

            .form-container {
                width: 400px;
                margin: 50px auto;
                padding: 25px;
                background-color: white;
                border: 1px solid #cccccc;
                border-radius: 10px;
            }

            h2 {
                text-align: center;
                color: #3366cc;
            }

            label {
                display: inline-block;
                width: 110px;
                margin-bottom: 15px;
                font-weight: bold;
            }

            input[type="text"],
            input[type="email"] {
                width: 230px;
                padding: 8px;
                border: 1px solid #aaaaaa;
                border-radius: 5px;
            }

            .hobby-label {
                width: auto;
                font-weight: normal;
            }

            .buttons {
                text-align: center;
                margin-top: 20px;
            }

            input[type="submit"],
            input[type="reset"] {
                padding: 10px 20px;
                margin: 5px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            input[type="submit"] {
                background-color: #3366cc;
                color: white;
            }

            input[type="reset"] {
                background-color: #dddddd;
                color: black;
            }

            input[type="submit"]:hover {
                background-color: #224499;
            }

            input[type="reset"]:hover {
                background-color: #bbbbbb;
            }
        </style>
    </head>

    <body>
        <div class="form-container">
            <h2>Thông tin cá nhân</h2>

            <form action="#" method="post">

                <label for="yourname">Họ và tên:</label>
                <input
                    type="text"
                    id="yourname"
                    name="yourname"
                    placeholder="Nhập họ và tên"
                    required
                >

                <br><br>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    required
                >

                <br><br>

                <label>Sở thích:</label>
                <br>

                <input
                    type="checkbox"
                    id="reading"
                    name="hobby"
                    value="reading"
                >
                <label class="hobby-label" for="reading">
                    Đọc sách
                </label>

                <input
                    type="checkbox"
                    id="music"
                    name="hobby"
                    value="music"
                >
                <label class="hobby-label" for="music">
                    Nghe nhạc
                </label>

                <br>

                <input
                    type="checkbox"
                    id="gaming"
                    name="hobby"
                    value="gaming"
                >
                <label class="hobby-label" for="gaming">
                    Chơi game
                </label>

                <input
                    type="checkbox"
                    id="travel"
                    name="hobby"
                    value="travel"
                >
                <label class="hobby-label" for="travel">
                    Du lịch
                </label>

                <div class="buttons">
                    <input
                        type="submit"
                        value="Gửi thông tin"
                    >

                    <input
                        type="reset"
                        value="Nhập lại"
                    >
                </div>

            </form>
        </div>
    </body>
</html>
