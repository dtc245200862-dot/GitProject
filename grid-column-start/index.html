
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Column Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Grid - grid-column-start</h1>

    <h2>Ví dụ 1: Giá trị auto</h2>

    <div class="grid example-1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>

    <h2>Ví dụ 2: Bắt đầu từ cột số 2</h2>

    <div class="grid example-2">
        <div class="item item-start">Bắt đầu từ cột 2</div>
        <div class="item">Phần tử 2</div>
        <div class="item">Phần tử 3</div>
    </div>

    <h2>Ví dụ 3: Sử dụng span</h2>

    <div class="grid example-3">
        <div class="item item-span">Kéo dài 2 cột</div>
        <div class="item">Phần tử 2</div>
        <div class="item">Phần tử 3</div>
        <div class="item">Phần tử 4</div>
    </div>

    <h2>Ví dụ 4: Bắt đầu từ cột 3</h2>

    <div class="grid example-4">
        <div class="item item-column">Bắt đầu từ cột 3</div>
        <div class="item">Phần tử 2</div>
        <div class="item">Phần tử 3</div>
    </div>

</body>
</html>
