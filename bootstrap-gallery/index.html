<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Responsive Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Gallery ảnh</h1>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1015/600/400" alt="Ảnh 1">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1016/600/400" alt="Ảnh 2">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1025/600/400" alt="Ảnh 3">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1035/600/400" alt="Ảnh 4">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1043/600/400" alt="Ảnh 5">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/106/600/400" alt="Ảnh 6">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1074/600/400" alt="Ảnh 7">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img class="gallery-img" src="https://picsum.photos/id/1084/600/400" alt="Ảnh 8">
            </div>
        </div>
    </div>
</body>
</html>
