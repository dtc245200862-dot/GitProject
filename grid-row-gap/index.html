
<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row Gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Grid - grid-row-gap</h1>

    <h2>Ví dụ 1: Khoảng cách giữa các hàng là 20px</h2>

    <div class="grid example-1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>Ví dụ 2: Khoảng cách giữa các hàng là 50px</h2>

    <div class="grid example-2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>Ví dụ 3: Khoảng cách giữa các hàng là 5%</h2>

    <div class="grid example-3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>Ví dụ 4: Sử dụng initial</h2>

    <div class="grid example-4">
        <div class="item">1</div>

        <div class="item">3</div>
