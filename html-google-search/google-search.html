<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Form Tìm kiếm Google</title>
    </head>

    <body>
        <h2>Google Search</h2>

        <form
           action="https://www.bing.com/search"
            method="GET"
        >
            <input
                type="text"
                name="q"
                placeholder="Nhập từ khóa"
            >

            <input
                type="submit"
                value="Tìm kiếm"
            >
        </form>
    </body>
</html>
