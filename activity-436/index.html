<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Kho Phim Hoạt Hình</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">🎬 Hoạt Hình Việt</div>
        <nav class="head-link">

        <section class="right-content">

                    Trình duyệt của bạn không hỗ trợ thẻ video.

            </div>

            <div class="video-section" id="video2">

                <iframe src="https://www.youtube.com/embed/t0Q2otsqC4I" title="Tom and Jerry" allowfullscreen></iframe>
            </div>

            <div class="video-section" id="video3">
                <h2>Mickey Mouse</h2>
                <iframe src="https://www.youtube.com/embed/4d9WmK3Q8uE" title="Mickey Mouse" allowfullscreen></iframe>
            </div>

            <div class="video-section" id="video4">
                <h2>Pocoyo</h2>

    <footer id="about">
        <p>© 2026 Hoạt Hình Việt - Website học tập HTML & CSS</p>
