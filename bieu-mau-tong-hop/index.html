
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Các form HTML</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f8ff;
            }

            .form-container {
                width: 450px;
                margin: 30px auto;
                padding: 25px;
                background-color: white;
                border: 1px solid #cccccc;
                border-radius: 10px;
                box-shadow: 0 0 10px #cccccc;
            }

            h2 {
                text-align: center;
                color: #3366cc;
            }

            label {
                display: inline-block;
                width: 140px;
                margin-bottom: 15px;
                font-weight: bold;
            }

            input[type="text"],
            input[type="email"],
            input[type="tel"],
            input[type="date"],
            select,
            textarea {
                width: 250px;
                padding: 8px;
                border: 1px solid #aaaaaa;
                border-radius: 5px;
                box-sizing: border-box;
            }

            textarea {
                height: 80px;
                resize: vertical;
                vertical-align: top;
            }

            .hobby-label,
            .gender-label {
                width: auto;
                font-weight: normal;
            }

            .buttons {
                text-align: center;
                margin-top: 20px;
            }

            input[type="submit"],
            input[type="reset"] {
                padding: 10px 20px;
                margin: 5px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            input[type="submit"] {
                background-color: #3366cc;
                color: white;
            }

            input[type="reset"] {
                background-color: #dddddd;
                color: black;
            }

            input[type="submit"]:hover {
                background-color: #224499;
            }

            input[type="reset"]:hover {
                background-color: #bbbbbb;
            }

            hr {
                border: 0;
                border-top: 2px solid #dddddd;
                margin: 40px 0;
            }
        </style>
    </head>

    <body>

        <!-- PHẦN 1: FORM THÔNG TIN CÁ NHÂN -->

        <div class="form-container">
            <h2>Phần 1: Thông tin cá nhân</h2>

            <form action="#" method="post">

                <label for="yourname">Họ và tên:</label>
                <input
                    type="text"
                    id="yourname"
                    name="yourname"
                    placeholder="Nhập họ và tên"
                    required
                >

                <br><br>

                <label for="personal-email">Email:</label>
                <input
                    type="email"
                    id="personal-email"
                    name="email"
                    placeholder="Nhập email"
                    required
                >

                <br><br>

                <label>Sở thích:</label>
                <br>

                <input
                    type="checkbox"
                    id="reading"
                    name="hobby"
                    value="reading"
                >
                <label class="hobby-label" for="reading">
                    Đọc sách
                </label>

                <input
                    type="checkbox"
                    id="music"
                    name="hobby"
                    value="music"
                >
                <label class="hobby-label" for="music">
                    Nghe nhạc
                </label>

                <br>

                <input
                    type="checkbox"
                    id="gaming"
                    name="hobby"
                    value="gaming"
                >
                <label class="hobby-label" for="gaming">
                    Chơi game
                </label>

                <input
                    type="checkbox"
                    id="travel"
                    name="hobby"
                    value="travel"
                >
                <label class="hobby-label" for="travel">
                    Du lịch
                </label>

                <div class="buttons">
                    <input
                        type="submit"
                        value="Gửi thông tin"
                    >

                    <input
                        type="reset"
                        value="Nhập lại"
                    >
                </div>

            </form>
        </div>

        <hr>

        <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->

        <div class="form-container">
            <h2>Phần 2: Đăng ký học viên</h2>

            <form action="#" method="post">

                <label for="fullname">Họ và tên:</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullName"
                    placeholder="Nhập họ và tên"
                    required
                >

                <br><br>

                <label for="student-email">Email:</label>
                <input
                    type="email"
                    id="student-email"
                    name="studentEmail"
                    placeholder="Nhập email"
                    required
                >

                <br><br>

                <label for="phone">Số điện thoại:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                >

                <br><br>

                <label for="birthdate">Ngày sinh:</label>
                <input
                    type="date"
                    id="birthdate"
                    name="birthDate"
                >

                <br><br>

                <label>Giới tính:</label>

                <input
                    type="radio"
                    id="male"
                    name="gender"
                    value="male"
                >
                <label class="gender-label" for="male">
                    Nam
                </label>

                <input
                    type="radio"
                    id="female"
                    name="gender"
                    value="female"
                >
                <label class="gender-label" for="female">
                    Nữ
                </label>

                <br><br>

                <label for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="html-css">HTML và CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>

                <br><br>

                <label for="address">Địa chỉ:</label>
                <textarea
                    id="address"
                    name="address"
                    placeholder="Nhập địa chỉ"
                ></textarea>

                <div class="buttons">
                    <input
                        type="submit"
                        value="Đăng ký"
                    >

                    <input
                        type="reset"
                        value="Nhập lại"
                    >
                </div>

            </form>
        </div>

    </body>
</html>
