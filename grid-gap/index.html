
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Grid - grid-gap</h1>

    <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau</h2>

    <div class="grid example-1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau</h2>

    <div class="grid example-2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>Ví dụ 3: Khoảng cách chỉ định bằng đơn vị rem</h2>

    <div class="grid example-3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
