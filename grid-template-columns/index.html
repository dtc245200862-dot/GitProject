
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Columns</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Grid - grid-template-columns</h1>

    <h2>Ví dụ 1: Chia thành 3 cột bằng nhau</h2>

    <div class="grid example-1">
        <div class="item">Cột 1</div>
        <div class="item">Cột 2</div>
        <div class="item">Cột 3</div>
        <div class="item">Cột 4</div>
        <div class="item">Cột 5</div>
        <div class="item">Cột 6</div>
    </div>

    <h2>Ví dụ 2: Chia cột theo kích thước cụ thể</h2>

    <div class="grid example-2">
        <div class="item">Cột 1</div>
        <div class="item">Cột 2</div>
        <div class="item">Cột 3</div>
    </div>

    <h2>Ví dụ 3: Sử dụng đơn vị fr</h2>

    <div class="grid example-3">
        <div class="item">Cột 1</div>
        <div class="item">Cột 2</div>
        <div class="item">Cột 3</div>
    </div>

    <h2>Ví dụ 4: Cột có kích thước khác nhau</h2>

    <div class="grid example-4">
        <div class="item">Cột 1</div>
        <div class="item">Cột 2</div>
        <div class="item">Cột 3</div>
    </div>

</body>
</html>
