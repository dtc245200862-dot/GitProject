
<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">

        <title>Nhúng CSS vào HTML</title>

        <!-- Phần 2: Internal CSS -->
        <style>
            .internal-title {
                color: blue;
            }

            .internal-text {
                color: green;
            }
        </style>

        <!-- Phần 3: External CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Thực hành nhúng CSS vào HTML</h1>

        <!-- Phần 1: Inline CSS -->
        <section>
            <h2 style="color: red;">
                Phần 1: Inline CSS
            </h2>

            <p style="color: orange;">
                Đây là đoạn văn được định dạng bằng Inline CSS.
            </p>
        </section>

        <!-- Phần 2: Internal CSS -->
        <section>
            <h2 class="internal-title">
                Phần 2: Internal CSS
            </h2>

            <p class="internal-text">
                Đây là đoạn văn được định dạng bằng Internal CSS.
            </p>
        </section>

        <!-- Phần 3: External CSS -->
        <section>
            <h2 class="external-title">
                Phần 3: External CSS
            </h2>

            <p class="external-text">
                Đây là đoạn văn được định dạng bằng External CSS.
            </p>
        </section>
    </body>
</html>
