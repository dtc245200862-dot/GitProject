<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Flex Basis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính flex-basis</h1>

    <h2>1. Flex-basis: 200px</h2>
    <div class="container basis-number">
        <div class="item item-1">Item 1</div>
        <div class="item item-2">Item 2</div>
        <div class="item item-3">Item 3</div>
    </div>

    <h2>2. Flex-basis: auto</h2>
    <div class="container basis-auto">
        <div class="item item-1">Nội dung ngắn</div>
        <div class="item item-2">Nội dung dài hơn một chút</div>
        <div class="item item-3">Nội dung</div>
    </div>

    <h2>3. Flex-basis: initial</h2>
    <div class="container basis-initial">
        <div class="item item-1">Item 1</div>
        <div class="item item-2">Item 2</div>
        <div class="item item-3">Item 3</div>
    </div>

    <h2>4. Flex-basis: inherit</h2>
    <div class="parent">
        <div class="container basis-inherit">
            <div class="item item-1">Item 1</div>
            <div class="item item-2">Item 2</div>
            <div class="item item-3">Item 3</div>
        </div>
    </div>

</body>
</html>
