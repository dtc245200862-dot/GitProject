
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Danh sách sản phẩm</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                padding: 30px;
            }

            h1 {
                text-align: center;
                color: #3366cc;
            }

            table {
                width: 80%;
                margin: 20px auto;
                border-collapse: collapse;
                background-color: white;
            }

            th,
            td {
                border: 1px solid #999999;
                padding: 12px;
                text-align: center;
            }

            th {
                background-color: #3366cc;
                color: white;
            }

            tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            tr:hover {
                background-color: #e6f0ff;
            }
        </style>
    </head>

    <body>

        <h1>Danh sách sản phẩm</h1>

        <table>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>

            <tr>
                <td>Laptop ASUS</td>
                <td>15.000.000 VNĐ</td>
                <td>10</td>
            </tr>

            <tr>
                <td>Điện thoại OPPO</td>
                <td>5.000.000 VNĐ</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Chuột không dây</td>
                <td>250.000 VNĐ</td>
                <td>35</td>
            </tr>

            <tr>
                <td>Bàn phím cơ</td>
                <td>750.000 VNĐ</td>
                <td>15</td>
            </tr>
        </table>

    </body>
</html>
