
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Đăng ký người dùng</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
            }

            .form-container {
                width: 400px;
                margin: 50px auto;
                padding: 25px;
                background-color: white;
                border: 1px solid #cccccc;
                border-radius: 10px;
                box-shadow: 0 0 10px #cccccc;
            }

            h2 {
                text-align: center;
                color: #3366cc;
                margin-bottom: 25px;
            }

            label {
                display: inline-block;
                width: 130px;
                margin-bottom: 15px;
                font-weight: bold;
            }

            input[type="text"],
            input[type="email"],
            input[type="tel"] {
                width: 230px;
                padding: 8px;
                border: 1px solid #aaaaaa;
                border-radius: 5px;
                box-sizing: border-box;
            }

            .gender-label {
                width: auto;
                font-weight: normal;
            }

            .buttons {
                text-align: center;
                margin-top: 20px;
            }

            input[type="submit"],
            input[type="reset"] {
                padding: 10px 20px;
                margin: 5px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            input[type="submit"] {
                background-color: #3366cc;
                color: white;
            }

            input[type="reset"] {
                background-color: #dddddd;
                color: black;
            }

            input[type="submit"]:hover {
                background-color: #224499;
            }

            input[type="reset"]:hover {
                background-color: #bbbbbb;
            }
        </style>
    </head>

    <body>

        <div class="form-container">
            <h2>Đăng ký người dùng</h2>

            <form
                action="http://demo.codegym.vn/6/registration_form/register.php"
                method="POST"
            >

                <label for="name">Họ và tên:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Nhập họ và tên"
                    required
                >

                <br><br>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    required
                >

                <br><br>

                <label for="phone">Số điện thoại:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                    required
                >

                <br><br>

                <label>Giới tính:</label>

                <input
                    type="radio"
                    id="male"
                    name="gender"
                    value="male"
                    required
                >
                <label class="gender-label" for="male">
                    Nam
                </label>

                <input
                    type="radio"
                    id="female"
                    name="gender"
                    value="female"
                >
                <label class="gender-label" for="female">
                    Nữ
                </label>

                <div class="buttons">
                    <input
                        type="submit"
                        value="Đăng ký"
                    >

                    <input
                        type="reset"
                        value="Nhập lại"
                    >
                </div>

            </form>
        </div>

    </body>
</html>
