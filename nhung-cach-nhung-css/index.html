<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào trang web</title>
    <style>
        .internal {
            color: green;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="color: red;">Các cách nhúng CSS vào trang web</h1>

    <p style="color: blue;">Phần 1 - Đây là đoạn văn sử dụng inline-style để thay đổi màu chữ.</p>

    <p class="internal">Phần 2 - Đây là đoạn văn sử dụng internal-style để thay đổi màu chữ.</p>

    <p class="external">Phần 3 - Đây là đoạn văn sử dụng external-style để thay đổi màu chữ.</p>
</body>
</html>
